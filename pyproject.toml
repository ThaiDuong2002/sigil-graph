[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sigil"
version = "0.4.2"
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-typescript>=0.21",
    "tree-sitter-c-sharp>=0.21",
    "click>=8.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]
llm = ["litellm>=1.0"]

[project.scripts]
sigil = "sigil_cli.main:cli"
sigil-mcp = "sigil_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["sigil_core", "sigil_mcp", "sigil_cli"]
