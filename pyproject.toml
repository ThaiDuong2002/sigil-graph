[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "symbex"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-typescript>=0.21",
    "click>=8.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[project.scripts]
symbex = "symbex_cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["symbex_core", "symbex_mcp", "symbex_cli"]
